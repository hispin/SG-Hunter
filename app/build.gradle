apply plugin: 'com.android.application'

apply plugin: 'com.google.gms.google-services'

apply plugin: 'kotlin-android'


apply plugin: 'com.google.firebase.crashlytics'



// secrets are read from local.properties (not in git)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def secret = { String name -> localProps.getProperty(name) ?: System.getenv(name) ?: '' }

android {
    defaultConfig {
        manifestPlaceholders = [mapsApiKey: secret('MAPS_API_KEY')]
        buildConfigField 'String', 'AZURE_HUB_CONNECTION_STRING', "\"${secret('AZURE_HUB_CONNECTION_STRING')}\""
        buildConfigField 'String', 'AZURE_FUNCTION_CODE', "\"${secret('AZURE_FUNCTION_CODE')}\""
        compileSdk 36
        applicationId "com.sensoguard.hunter"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 89
        versionName "1.89"
        vectorDrawables.useSupportLibrary = true
    }
    packagingOptions {
        resources {
            pickFirsts += ['META-INF/LICENSE.txt', 'META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }


    signingConfigs {
        release {
            storeFile file(secret('RELEASE_STORE_FILE') ?: 'hunterKeystore.jks')
            storePassword secret('RELEASE_STORE_PASSWORD')
            keyAlias secret('RELEASE_KEY_ALIAS')
            keyPassword secret('RELEASE_KEY_PASSWORD')
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = '17'
    }


    buildTypes {
        release {
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            ext.alwaysUpdateBuildId = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.sensoguard.hunter'
    //compileSdk 34
    //buildToolsVersion '34.0.0'


}



configurations {
    configureEach {
        exclude module: 'commons-logging'
    }
}



dependencies {

    implementation 'androidx.media3:media3-exoplayer:1.9.2'
    implementation 'androidx.media3:media3-ui:1.9.2'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.2'

    implementation 'androidx.appcompat:appcompat:1.7.1'//cannot upgrade
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.1'
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation 'javax.inject:javax.inject:1'

    //Support language
    implementation 'com.github.delight-im:Android-Languages:v1.0.1'
    implementation 'com.squareup:android-times-square:1.7.11@aar'

    //email alarms
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation 'com.sun.mail:android-activation:1.6.8'
    implementation 'org.jsoup:jsoup:1.23.2'

    //glide
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'com.github.bumptech.glide:annotations:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    //firebase
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-messaging-directboot'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    //azura
    implementation 'com.microsoft.azure:notification-hubs-android-sdk:2.0.0@aar'

    testImplementation 'junit:junit:4.13.2'
}
