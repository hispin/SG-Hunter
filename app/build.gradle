apply plugin: 'com.android.application'

apply plugin: 'com.google.gms.google-services'

// upgrade: removed 'kotlin-android' - AGP 9 compiles Kotlin with its built-in Kotlin support


apply plugin: 'com.google.firebase.crashlytics'



// secrets are read from local.properties (not in git)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def secret = { String name -> localProps.getProperty(name) ?: System.getenv(name) ?: '' }

android {
    // upgrade: compileSdk moved out of defaultConfig, raised to 37 (required by Glide 5.0.9);
    // targetSdk stays 36, so runtime behavior does not change
    compileSdk = 37

    defaultConfig {
        manifestPlaceholders = [mapsApiKey: secret('MAPS_API_KEY')]
        buildConfigField 'String', 'AZURE_HUB_CONNECTION_STRING', "\"${secret('AZURE_HUB_CONNECTION_STRING')}\""
        buildConfigField 'String', 'AZURE_FUNCTION_CODE', "\"${secret('AZURE_FUNCTION_CODE')}\""
        applicationId = "com.sensoguard.hunter"
        // upgrade: new DSL names (minSdkVersion/targetSdkVersion are removed in AGP 9)
        minSdk = 26
        targetSdk = 36
        versionCode = 91
        versionName = "1.91"
        vectorDrawables.useSupportLibrary = true
    }
    // upgrade: packagingOptions was renamed to packaging
    packaging {
        resources {
            pickFirsts += ['META-INF/LICENSE.txt', 'META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }


    signingConfigs {
        release {
            storeFile = file(secret('RELEASE_STORE_FILE') ?: 'hunterKeystore.jks')
            storePassword = secret('RELEASE_STORE_PASSWORD')
            keyAlias = secret('RELEASE_KEY_ALIAS')
            keyPassword = secret('RELEASE_KEY_PASSWORD')
        }
    }

    // lint fix: the app switches language at runtime, so every language must stay
    // in the installed app (otherwise Play installs only the device language)
    bundle {
        language {
            enableSplit = false
        }
    }

    // upgrade: properties use the "name = value" syntax (the old form is removed in Gradle 10)
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    // upgrade: kotlinOptions moved to the kotlin { compilerOptions } block below


    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // edge-to-edge (Play "deprecated APIs"): R8 removes unused library code, including the
            // deprecated setStatusBarColor/setNavigationBarColor calls in unused androidx/Material classes
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            ext.alwaysUpdateBuildId = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' // inspection fix: optimize rules

            debuggable = true
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    namespace = 'com.sensoguard.hunter'
    //compileSdk 34
    //buildToolsVersion '34.0.0'


}

// upgrade: Kotlin compiler options for AGP 9 built-in Kotlin
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}



configurations {
    configureEach {
        exclude module: 'commons-logging'
    }
}



dependencies {

    implementation 'androidx.media3:media3-exoplayer:1.11.1' // lint fix: updated version
    implementation 'androidx.media3:media3-ui:1.11.1' // lint fix: updated version
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1' // lint fix: updated version

    // upgrade: the old "cannot upgrade" note dated from appcompat 1.3.0-alpha02 (2023) and no longer applies
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2' // lint fix: updated version
    implementation 'androidx.fragment:fragment-ktx:1.9.1' // lint fix: updated version
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0' // lint fix: updated version
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0' // lint fix: updated version
    implementation 'androidx.work:work-runtime-ktx:2.12.0' // lint fix: updated version
    implementation 'com.google.android.material:material:1.14.0' // lint fix: updated version

    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0' // upgrade: possible now with Kotlin 2.3

    implementation 'com.google.code.gson:gson:2.14.0' // lint fix: updated version
    implementation 'com.opencsv:opencsv:5.12.0'
    implementation 'javax.inject:javax.inject:1'

    //Support language
    implementation 'com.github.delight-im:Android-Languages:v1.0.1'
    implementation 'com.squareup:android-times-square:1.7.11@aar'

    //email alarms
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation 'com.sun.mail:android-activation:1.6.8'
    implementation 'org.jsoup:jsoup:1.23.2'

    //glide
    implementation 'com.github.bumptech.glide:glide:5.0.9' // upgrade: possible now with compileSdk 37
    implementation 'com.github.bumptech.glide:annotations:5.0.9' // upgrade: possible now with compileSdk 37
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9' // upgrade: possible now with compileSdk 37

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    //firebase
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-messaging-directboot'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    //azura
    implementation 'com.microsoft.azure:notification-hubs-android-sdk:2.0.0@aar'

    testImplementation 'junit:junit:4.13.2'
}
